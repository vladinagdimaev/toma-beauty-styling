{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ SITENAME }}{% endblock %}
{% block content %}
<header class="border-b border-neutral-200 bg-white">
  <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4">
    <a href="{{ SITEURL }}/" class="font-bold tracking-wide">ToMa Beauty by Tamara Solomonov</a>
    <a href="{{ SITEURL }}/" class="text-sm underline underline-offset-4">חזרה לאתר</a>
  </div>
</header>
<main class="mx-auto max-w-4xl px-4 py-12 md:py-16">
  <article class="legal-content">
    <h1>{{ page.title }}</h1>
    {{ page.content }}
  </article>
</main>
<footer class="border-t border-neutral-200 bg-neutral-50">
  <div class="mx-auto max-w-4xl px-4 py-8 text-sm text-neutral-600">
    <div class="flex flex-wrap gap-4">
      <a href="{{ SITEURL }}/privacy/">פרטיות</a>
      <a href="{{ SITEURL }}/accessibility/">נגישות</a>
      <a href="{{ SITEURL }}/">עמוד הבית</a>
    </div>
    <p class="mt-5 text-xs text-neutral-500">האתר נוצר באהבה על ידי <a class="underline underline-offset-4" href="https://sensei.art" target="_blank" rel="noopener">sensei.art</a></p>
  </div>
</footer>
{% endblock %}
